apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: nginx
      version: "15.5.0"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    image:
      registry: docker.io
      repository: library/nginx   # official nginx image
      tag: "1.25.3"              # valid tag
    replicaCount: 2
    service:
      type: NodePort
      port: 80
      nodePort: 30080             # you can access via node-ip:30080
    # <- optional, choose any port 30000-32767

