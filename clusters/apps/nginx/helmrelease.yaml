apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: nginx
      version: "15.5.0"
      sourceRef:
        kind: HelmRepository
        name: bitnami        # ✅ MUST be bitnami
        namespace: flux-system
  values:
    replicaCount: 1
    image:
      repository: nginx
      tag: "1.25.3"
    service:
      type: NodePort
      nodePort: 30080


