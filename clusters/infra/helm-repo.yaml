apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: nginx
      sourceRef:
        kind: HelmRepository
        name: stable
        namespace: flux-system
  values:
    image:
      repository: nginx
      tag: "1.25"
    service:
      type: NodePort
      nodePort: 30080
